
name: Build Mashup Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q MashupStudioAndroid-starter.zip -d extracted

      - name: Build APK
        working-directory: extracted/MashupStudioAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MashupStudio-APK
          path: extracted/MashupStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          
