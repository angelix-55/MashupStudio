
name: Build Mashup Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q MashupStudio-v2-MatchFinder-source.zip -d extracted -d extracted

      - name: Fix JVM compatibility
        working-directory: extracted/MashupStudioAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures { compose = true }"
          patch = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if "jvmTarget = \"17\"" not in s:
              s = s.replace(marker, patch + "\n" + marker)
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted/MashupStudioAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MashupStudio-APK
          path: extracted/MashupStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          
